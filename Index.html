<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Menu VR</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b1020;text-align:center;padding:20px}
button{font:700 20px system-ui;padding:14px 28px;border:0;border-radius:14px;background:#4cc9f0;color:#06121f}
#st{font-size:14px;opacity:.85;max-width:420px}
label{font-size:14px}
</style>
</head>
<body>
<div id="ov">
  <h2>Menu VR</h2>
  <div id="st">Deixe o celular deitado no VR Box. Permita a câmera e o movimento quando pedir.</div>
  <label><input type="checkbox" id="two" checked> Duas telas (VR Box)</label>
  <button id="go">INICIAR</button>
</div>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay style="display:none"></video>
<script type="module">
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), vid = $('v'), st = $('st');
let stereo = true, dpr = 1, lm = null, running = false;

function resize(){ dpr = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', resize);

/* ---------- Filtro One Euro: tira o tremor sem dar atraso ---------- */
class OE{
  constructor(mc, b, dc){ this.mc = mc; this.b = b; this.dc = dc; this.x = null; this.dx = 0; this.t = 0; }
  a(c, dt){ const r = 2 * Math.PI * c * dt; return r / (r + 1); }
  f(x, t){
    if(this.x === null){ this.x = x; this.t = t; return x; }
    const dt = Math.max(t - this.t, 1e-3); this.t = t;
    this.dx += this.a(this.dc, dt) * ((x - this.x) / dt - this.dx);
    this.x += this.a(this.mc + this.b * Math.abs(this.dx), dt) * (x - this.x);
    return this.x;
  }
}
const mkF = () => Array.from({length: 42}, () => new OE(1.6, 45, 1.0));
const hands = [0, 1].map(() => ({on: false, seen: 0, f: mkF(), t: null, d: null, pinch: false}));

/* ---------- Hand tracking ---------- */
let lastVT = -1;
function detect(){
  if(!lm || vid.readyState < 2 || vid.currentTime === lastVT) return;
  lastVT = vid.currentTime;
  const now = performance.now();
  let r; try{ r = lm.detectForVideo(vid, now); }catch(e){ return; }
  const t = now / 1000, used = new Set();
  for(const p of (r.landmarks || [])){
    let best = -1, bd = 9;
    hands.forEach((h, i) => {
      if(used.has(i)) return;
      const d = h.on ? Math.hypot(h.t[0].x - p[0].x, h.t[0].y - p[0].y) : 0.3;
      if(d < bd){ bd = d; best = i; }
    });
    if(best < 0) continue;
    used.add(best);
    const h = hands[best];
    if(!h.on){ h.f = mkF(); h.d = null; }
    h.on = true; h.seen = t;
    h.t = p.map((q, i) => ({x: h.f[i * 2].f(q.x, t), y: h.f[i * 2 + 1].f(q.y, t)}));
    if(!h.d) h.d = h.t.map(q => ({...q}));
  }
}

/* ---------- Giroscópio ---------- */
const mul = (a, b) => { const [ax,ay,az,aw] = a, [bx,by,bz,bw] = b; return [ax*bw+aw*bx+ay*bz-az*by, ay*bw+aw*by+az*bx-ax*bz, az*bw+aw*bz+ax*by-ay*bx, aw*bw-ax*bx-ay*by-az*bz]; };
function quat(a, b, g, o){
  const d = Math.PI / 180, x = b*d, y = a*d, z = -g*d;
  const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2), s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
  let q = [s1*c2*c3+c1*s2*s3, c1*s2*c3-s1*c2*s3, c1*c2*s3-s1*s2*c3, c1*c2*c3+s1*s2*s3];
  q = mul(q, [-Math.SQRT1_2, 0, 0, Math.SQRT1_2]);
  const h = -o * d / 2;
  return mul(q, [0, 0, Math.sin(h), Math.cos(h)]);
}
function fwd([x, y, z, w]){
  // gira o vetor (0,0,-1) pelo quaternion
  return [-2*w*y - 2*x*z, 2*w*x - 2*y*z, -1 + 2*x*x + 2*y*y];
}
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
let gy = {has: false, yaw: 0, pitch: 0, y0: 0, p0: 0, init: false};
function onOri(e){
  if(e.alpha == null) return;
  const o = (screen.orientation ? screen.orientation.angle : (window.orientation || 0));
  const f = fwd(quat(e.alpha, e.beta, e.gamma, o));
  const yaw = Math.atan2(f[0], -f[2]), pitch = Math.asin(Math.max(-1, Math.min(1, f[1])));
  if(!gy.init){ gy.yaw = yaw; gy.pitch = pitch; gy.y0 = yaw; gy.p0 = pitch; gy.init = true; }
  // Sensibilidade máxima: aplicar cada atualização do sensor sem amortecer o movimento.
  gy.yaw = yaw;
  gy.pitch = pitch;
  gy.has = true;
}
addEventListener('dblclick', () => { gy.y0 = gy.yaw; gy.p0 = gy.pitch; });

/* ---------- Desenho ---------- */
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const items = ['JOGOS', 'CONFIGURAÇÕES', 'LOJA'];
let EW, EH, cur = [], lastT = 0, menu = {};
let settingsOpen = false, tracking3Dof = true;
let gamesOpen = false, storeOpen = false, labActive = false, menuVisible = true;
const labBlocks = Array.from({length: 8}, (_, i) => ({x: 0.30 + (i % 4) * 0.105, y: 0.58 - Math.floor(i / 4) * 0.13, vx: 0, vy: 0, color: ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#a78bfa','#f472b6','#fb923c','#a3e635'][i]}));
let draggedBlock = -1;
const pinchLatch = [false, false];
const thumbsUpLatch = [false, false];

const toEye = p => {
  const vw = vid.videoWidth || 1280, vh = vid.videoHeight || 720, s = Math.max(EW / vw, EH / vh);
  return [(EW - vw * s) / 2 + p.x * vw * s, (EH - vh * s) / 2 + p.y * vh * s];
};

function layoutMenu(dt){
  const m = Math.min(EW, EH), ppd = EH / 1.0;
  if(tracking3Dof && gy.has){
    // menu preso no mundo: ao virar a cabeça ele fica no lugar (escala pelo campo de visão da câmera, ~66°)
    const vw = vid.videoWidth || 1280, vh = vid.videoHeight || 720;
    const fpx = 0.77 * vw * Math.max(EW / vw, EH / vh);
    const dy = Math.max(-1.4, Math.min(1.4, wrap(gy.yaw - gy.y0)));
    const dp = Math.max(-1.4, Math.min(1.4, gy.pitch - gy.p0));
    menu.cx = EW / 2 - fpx * Math.tan(dy); menu.cy = EH / 2 + fpx * Math.tan(dp);
  } else { menu.cx = EW / 2; menu.cy = EH / 2; }
  menu.m = m; menu.w = m * 0.6; menu.h = m * 0.86;
  const shownItems = settingsOpen ? ['VOLTAR', tracking3Dof ? 'DESATIVAR 3DOF' : 'ATIVAR 3DOF'] : (gamesOpen || storeOpen) ? ['VOLTAR'] : items;
  menu.btn = shownItems.map((n, i) => ({n, x: menu.cx - m * 0.26, y: menu.cy - menu.h / 2 + m * (gamesOpen ? 0.70 : 0.17) + i * m * 0.175, w: m * 0.52, h: m * 0.12}));
  menu.gameCard = gamesOpen ? {x:menu.cx-m*.235,y:menu.cy-m*.22,w:m*.47,h:m*.47} : null;
}

function detectThumbsUp(){
  for(let i = 0; i < hands.length; i++){
    const h = hands[i];
    if(!h.on || !h.d) { thumbsUpLatch[i] = false; continue; }
    const p = h.d;
    // Polegar para cima = tela única; polegar para baixo = tela dividida.
    const thumbUp = p[4].y < p[3].y && p[3].y < p[2].y;
    const thumbDown = p[4].y > p[3].y && p[3].y > p[2].y;
    const fingersCurled = [[8,6],[12,10],[16,14],[20,18]].every(([tip,pip]) => p[tip].y > p[pip].y + 0.015);
    const gestureUp = thumbUp && fingersCurled;
    const gestureDown = thumbDown && fingersCurled;
    const gesture = gestureUp || gestureDown;
    if(gesture && !thumbsUpLatch[i]){
      if(gestureUp){
        stereo = false;
        $('two').checked = false;
        st.textContent = 'Joinha para cima: modo de tela única ativado.';
      } else if(gestureDown){
        stereo = true;
        $('two').checked = true;
        st.textContent = 'Joinha para baixo: modo de tela dividida ativado.';
      }
    }
    thumbsUpLatch[i] = gesture;
  }
}

function drawHands(){
  cur = [];
  for(const h of hands){
    if(!h.on) continue;
    const P = h.d.map(toEye);
    const size = Math.hypot(h.d[0].x - h.d[9].x, h.d[0].y - h.d[9].y) || 1;
    const pd = Math.hypot(h.d[4].x - h.d[8].x, h.d[4].y - h.d[8].y) / size;
    h.pinch = h.pinch ? pd < 0.45 : pd < 0.3;
    cur.push({pt: [(P[4][0] + P[8][0]) / 2, (P[4][1] + P[8][1]) / 2], pinch: h.pinch, id: hands.indexOf(h)});
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = h.pinch ? '#7CFF6B' : 'rgba(255,255,255,.9)';
    ctx.beginPath();
    for(const [a, b] of BONES){ ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(P[b][0], P[b][1]); }
    ctx.stroke();
    P.forEach((p, i) => {
      ctx.fillStyle = [4,8,12,16,20].includes(i) ? '#4cc9f0' : '#fff';
      ctx.beginPath(); ctx.arc(p[0], p[1], [4,8,12,16,20].includes(i) ? 5 : 3.2, 0, 7); ctx.fill();
    });
  }
}

function handlePinch(){
  for(let i = 0; i < pinchLatch.length; i++){
    const c = cur.find(q => q.id === i);
    if(!c || !c.pinch){ pinchLatch[i] = false; continue; }
    if(pinchLatch[i]) continue;
    pinchLatch[i] = true;
    if(gamesOpen && menu.gameCard && c.pt[0]>=menu.gameCard.x && c.pt[0]<=menu.gameCard.x+menu.gameCard.w && c.pt[1]>=menu.gameCard.y && c.pt[1]<=menu.gameCard.y+menu.gameCard.h){
      labActive=true; menuVisible=false; gamesOpen=false; pinchLatch[i]=true; continue;
    }
    const b = menu.btn.find(q => c.pt[0] >= q.x && c.pt[0] <= q.x + q.w && c.pt[1] >= q.y && c.pt[1] <= q.y + q.h);
    if(!b) continue;
    if(settingsOpen){
      if(b.n === 'VOLTAR') settingsOpen = false;
      else if(b.n.includes('3DOF')) { tracking3Dof = !tracking3Dof; settingsOpen = false; }
    } else if(gamesOpen){
      if(b.n === 'VOLTAR') gamesOpen = false;
      else if(b.n === 'LABORATÓRIO DE HAND TRACKING'){ labActive = true; menuVisible = false; gamesOpen = false; }
    } else if(storeOpen){ if(b.n === 'VOLTAR') storeOpen = false; }
    else if(b.n === 'JOGOS') gamesOpen = true;
    else if(b.n === 'CONFIGURAÇÕES') settingsOpen = true;
    else if(b.n === 'LOJA') storeOpen = true;
  }
}

function drawCloseX(){
  const x = innerWidth - 42, y = 30;
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x-9,y-9); ctx.lineTo(x+9,y+9); ctx.moveTo(x+9,y-9); ctx.lineTo(x-9,y+9); ctx.stroke(); ctx.restore();
}
function drawLab(){
  const w = EW, h = EH;
  // Mesa virtual em perspectiva, apresentada sobre a imagem da câmera.
  ctx.save();
  ctx.fillStyle = 'rgba(12,22,40,.78)'; ctx.strokeStyle = 'rgba(130,220,255,.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(w*.12,h*.69); ctx.lineTo(w*.88,h*.69); ctx.lineTo(w*.98,h*.91); ctx.lineTo(w*.02,h*.91); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '700 18px system-ui'; ctx.fillText('LABORATÓRIO DE HAND TRACKING',w/2,h*.12);
  ctx.font = '14px system-ui'; ctx.fillText('Faça pinça para pegar e arraste para movimentar os blocos',w/2,h*.17);
  for(const b of labBlocks){
    const x=b.x*w, y=b.y*h, s=Math.min(w,h)*.075;
    ctx.fillStyle=b.color; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(x-s/2,y-s/2,s,s,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x-s*.32,y+s*.22,s*.64,s*.08);
  }
  ctx.restore();
}
function updateLabInteraction(){
  for(const c of cur){
    if(c.pinch){
      if(draggedBlock < 0){
        let best=-1,bd=Infinity;
        labBlocks.forEach((b,i)=>{const d=Math.hypot(c.pt[0]-b.x*EW,c.pt[1]-b.y*EH); if(d<Math.min(EW,EH)*.09 && d<bd){best=i;bd=d;}});
        draggedBlock=best;
      }
      if(draggedBlock>=0){labBlocks[draggedBlock].x=c.pt[0]/EW;labBlocks[draggedBlock].y=c.pt[1]/EH;}
    } else draggedBlock=-1;
  }
  for(const b of labBlocks){ b.vy+=0.0008; b.y+=b.vy; if(b.y>0.66){b.y=0.66;b.vy*=-.25;} }
}
function drawMenu(dx){
  const m = menu.m;
  ctx.save(); ctx.translate(dx, 0);
  ctx.fillStyle = 'rgba(8,16,36,.78)'; ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(menu.cx - menu.w / 2, menu.cy - menu.h / 2, menu.w, menu.h, m * 0.05); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + m * 0.065 + 'px system-ui'; ctx.fillText(settingsOpen ? 'CONFIGURAÇÕES' : gamesOpen ? 'JOGOS 1/10' : storeOpen ? 'LOJA' : 'MENU', menu.cx, menu.cy - menu.h / 2 + m * 0.09);
  if(storeOpen){
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='700 '+m*.052+'px system-ui';ctx.fillText('A loja está em desenvolvimento.',menu.cx,menu.cy);
  }
  if(gamesOpen && menu.gameCard){
    const g=menu.gameCard, cx=g.x+g.w/2, cy=g.y+g.h/2;
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.strokeStyle='#4cc9f0'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.roundRect(g.x,g.y,g.w,g.h,m*.035); ctx.fill(); ctx.stroke();
    // miniatura ilustrada do laboratório: mesa e cubos coloridos
    ctx.fillStyle='rgba(10,20,38,.95)'; ctx.beginPath(); ctx.roundRect(g.x+m*.025,g.y+m*.025,g.w-m*.05,g.h*.68,m*.025); ctx.fill();
    ctx.fillStyle='rgba(76,201,240,.45)'; ctx.beginPath(); ctx.moveTo(g.x+m*.07,g.y+g.h*.48); ctx.lineTo(g.x+g.w-m*.07,g.y+g.h*.48); ctx.lineTo(g.x+g.w-m*.10,g.y+g.h*.62); ctx.lineTo(g.x+m*.10,g.y+g.h*.62); ctx.closePath(); ctx.fill();
    const cols=['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#a78bfa'];
    cols.forEach((col,i)=>{ctx.fillStyle=col;ctx.fillRect(g.x+g.w*(.19+i*.14),g.y+g.h*(.27+(i%2)*.07),m*.055,m*.055);});
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 '+m*.038+'px system-ui';
    ctx.fillText('LABORATÓRIO DE HAND TRACKING',cx,g.y+g.h*.78);
    ctx.font='500 '+m*.027+'px system-ui';ctx.fillText('Pegue e movimente os cubos',cx,g.y+g.h*.89);
  }
  for(const b of menu.btn){
    const hov = cur.some(c => c.pt[0] > b.x && c.pt[0] < b.x + b.w && c.pt[1] > b.y && c.pt[1] < b.y + b.h);
    const press = hov && cur.some(c => c.pinch);
    ctx.fillStyle = press ? '#7CFF6B' : hov ? '#4cc9f0' : 'rgba(76,201,240,.22)';
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, m * 0.03); ctx.fill();
    ctx.fillStyle = hov ? '#06121f' : '#fff';
    ctx.font = '700 ' + m * (b.n.length > 8 ? 0.05 : 0.065) + 'px system-ui';
    ctx.fillText(b.n, b.x + b.w / 2, b.y + b.h / 2);
  }
  for(const c of cur){
    ctx.strokeStyle = c.pinch ? '#7CFF6B' : '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.pt[0], c.pt[1], c.pinch ? m * 0.018 : m * 0.03, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function frame(ts){
  if(!running) return;
  requestAnimationFrame(frame);
  const t = ts / 1000, dt = Math.min(t - lastT, 0.1) || 0.016; lastT = t;
  detect();
  detectThumbsUp();
  // suavização extra a cada frame de tela (60Hz) para ficar bem fluido
  const k = 1 - Math.exp(-dt * 28);
  for(const h of hands){
    if(h.on && t - h.seen > 0.25){ h.on = false; h.d = null; continue; }
    if(h.on) h.t.forEach((q, i) => { h.d[i].x += (q.x - h.d[i].x) * k; h.d[i].y += (q.y - h.d[i].y) * k; });
  }
  const IW = innerWidth, IH = innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, IW, IH);
  EW = stereo ? IW / 2 : IW; EH = IH;
  layoutMenu(dt);
  const vw = vid.videoWidth || 1280, vh = vid.videoHeight || 720, s = Math.max(EW / vw, EH / vh);
  const disp = EW * 0.008;
  for(let e = 0; e < (stereo ? 2 : 1); e++){
    ctx.save(); ctx.translate(e * EW, 0);
    ctx.beginPath(); ctx.rect(0, 0, EW, EH); ctx.clip();
    // Duas vistas independentes lado a lado, com pequeno deslocamento de paralaxe.
    const eyeShift = stereo ? (e === 0 ? -disp : disp) : 0;
    ctx.drawImage(vid, (EW - vw * s) / 2 + eyeShift, (EH - vh * s) / 2, vw * s, EH < vh*s ? vh*s : vh*s);
    drawHands();
    if(e === 0){ if(labActive) updateLabInteraction(); else if(menuVisible) handlePinch(); }
    if(labActive) drawLab();
    else if(menuVisible) drawMenu(stereo ? (e === 0 ? disp : -disp) : 0);
    ctx.restore();
  }
  if(stereo){
    // separador central para deixar explícitas as duas vistas do VR Box
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(IW/2,0);ctx.lineTo(IW/2,IH);ctx.stroke();ctx.restore();
  }
  drawCloseX();
}

/* ---------- Início ---------- */
cv.addEventListener('pointerdown', e => {
  const x=innerWidth-42,y=30;
  if(Math.hypot(e.clientX-x,e.clientY-y)<28){
    if(labActive){labActive=false;menuVisible=true;} else menuVisible=!menuVisible;
    e.preventDefault();
  }
});
$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true;
  stereo = $('two').checked;
  let step = 'permissões';
  try{
    document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {});
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      await DeviceOrientationEvent.requestPermission();
    }
    // Prioriza orientação absoluta (referenciada ao mundo); usa deviceorientation como fallback.
    const absoluteSupported = ('ondeviceorientationabsolute' in window);
    if(absoluteSupported) addEventListener('deviceorientationabsolute', onOri, true);
    else addEventListener('deviceorientation', onOri, true);
    st.textContent = 'Giroscópio ativado: sensibilidade máxima. Abrindo a câmera...';
    const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 60}}});
    vid.srcObject = stream; await vid.play();
    navigator.wakeLock?.request('screen').catch(() => {});
    st.textContent = 'Carregando o rastreio das mãos (pode demorar um pouco)...';
    const BASES = ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14', 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
    let lib = null, base = '';
    for(const b of BASES){
      try{ step = 'biblioteca das mãos'; lib = await import(b + '/vision_bundle.mjs'); base = b; break; }catch(e){}
    }
    if(!lib) throw new Error('não consegui baixar a biblioteca (confira a internet)');
    const {FilesetResolver, HandLandmarker} = lib;
    step = 'arquivos de processamento';
    const fs = await FilesetResolver.forVisionTasks(base + '/wasm');
    step = 'modelo da mão';
    const res = await fetch('https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task');
    if(!res.ok) throw new Error('o download do modelo deu erro ' + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    step = 'iniciar o rastreio';
    const opt = d => ({baseOptions: {modelAssetBuffer: buf, delegate: d}, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5});
    try{ lm = await HandLandmarker.createFromOptions(fs, opt('GPU')); }
    catch(e){ lm = await HandLandmarker.createFromOptions(fs, opt('CPU')); }
    $('ov').style.display = 'none'; cv.style.display = 'block';
    resize(); running = true; requestAnimationFrame(frame);
  }catch(e){
    st.textContent = 'Deu erro em "' + step + '": ' + (e.message || e) + '. Confira a internet e se você permitiu a câmera e o movimento.';
    btn.disabled = false; btn.textContent = 'TENTAR DE NOVO';
  }
};
</script>
</body>
