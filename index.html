<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Menu VR</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#18264b 0%,#f29b62 52%,#f7c47d 68%,#304c32 69%,#14251b 100%);text-align:center;padding:20px;overflow:hidden}
#ov:before{content:"";position:absolute;left:-8%;right:-8%;bottom:-4%;height:34%;background:linear-gradient(160deg,transparent 0 22%,#253f28 23% 100%);clip-path:polygon(0 45%,18% 20%,35% 43%,55% 12%,72% 40%,100% 15%,100% 100%,0 100%);z-index:0}
#ov:after{content:"";position:absolute;inset:auto 0 0;height:20%;background:repeating-linear-gradient(100deg,#162b1c 0 3px,#29462a 3px 6px);opacity:.9;z-index:0}
#ov>*{position:relative;z-index:1}
#ov h2{font-size:clamp(34px,8vw,58px);margin:0;text-shadow:0 3px 12px #15233b;letter-spacing:1px}
#version{position:absolute!important;left:14px;bottom:12px;font-size:12px;opacity:.9;z-index:2!important;text-shadow:0 1px 5px #000}
#logo{font-size:clamp(54px,13vw,88px);filter:drop-shadow(0 4px 8px #17243b);line-height:1.1}
#st{color:#fff;text-shadow:0 1px 5px #17243b}
#go{margin-top:10px;box-shadow:0 5px 18px #17243b66}
button{font:700 20px system-ui;padding:14px 28px;border:0;border-radius:14px;background:#4cc9f0;color:#06121f}
#st{font-size:14px;opacity:.85;max-width:420px}
#loader{display:none;width:34px;height:34px;border:4px solid rgba(255,255,255,.2);border-top-color:#4cc9f0;border-radius:50%;animation:spin .8s linear infinite}
#ov.loading #loader{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
label{font-size:14px}
</style>
</head>
<body>
<div id="ov">
  <div id="logo" aria-hidden="true">🥽</div>
  <h2>MENU VR</h2>
  <div id="st">Prepare seu VR Box e permita a câmera e o movimento quando solicitado.</div>
  <div id="loader" aria-label="Carregando"></div>
  <button id="go">ENTRAR EM VR</button>
  <div id="version">Menu VR versão 0.0001 · @lsevi_12</div>
</div>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay style="display:none"></video>
<script type="module">
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), vid = $('v'), st = $('st');
let stereo = true, dpr = 1, lm = null, running = false;

function resize(){ dpr = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', resize);

/* ---------- Filtro One Euro: tira o tremor sem dar atraso ---------- */
class OE{
  constructor(mc, b, dc){ this.mc = mc; this.b = b; this.dc = dc; this.x = null; this.dx = 0; this.t = 0; }
  a(c, dt){ const r = 2 * Math.PI * c * dt; return r / (r + 1); }
  f(x, t){
    if(this.x === null){ this.x = x; this.t = t; return x; }
    const dt = Math.max(t - this.t, 1e-3); this.t = t;
    this.dx += this.a(this.dc, dt) * ((x - this.x) / dt - this.dx);
    this.x += this.a(this.mc + this.b * Math.abs(this.dx), dt) * (x - this.x);
    return this.x;
  }
}
const mkF = () => Array.from({length: 42}, () => new OE(1.6, 45, 1.0));
const hands = [0, 1].map(() => ({on: false, seen: 0, f: mkF(), t: null, d: null, pinch: false}));

/* ---------- Hand tracking ---------- */
let lastVT = -1;
function detect(){
  if(!lm || vid.readyState < 2 || vid.currentTime === lastVT) return;
  lastVT = vid.currentTime;
  const now = performance.now();
  let r; try{ r = lm.detectForVideo(vid, now); }catch(e){ return; }
  const t = now / 1000, used = new Set();
  const points = r.landmarks || [];
  const labels = r.handednesses || r.handedness || [];
  for(let n = 0; n < points.length; n++){
    const p = points[n];
    const side = labels[n]?.[0]?.categoryName || '';
    // Mantém cada mão no seu próprio rastreador (esquerda/direita).
    let best = side === 'Left' ? 0 : side === 'Right' ? 1 : -1;
    if(best < 0 || used.has(best)){
      best = -1;
      let bd = Infinity;
      hands.forEach((h, i) => {
        if(used.has(i)) return;
        const d = h.on && h.t ? Math.hypot(h.t[0].x - p[0].x, h.t[0].y - p[0].y) : (h.on ? 1 : 2);
        if(d < bd){ bd = d; best = i; }
      });
    }
    if(best < 0 || used.has(best)) continue;
    used.add(best);
    const h = hands[best];
    if(!h.on){ h.f = mkF(); h.d = null; }
    h.side = side;
    h.on = true; h.seen = t;
    h.t = p.map((q, i) => ({x: h.f[i * 2].f(q.x, t), y: h.f[i * 2 + 1].f(q.y, t)}));
    if(!h.d) h.d = h.t.map(q => ({...q}));
  }
}

/* ---------- Giroscópio ---------- */
const mul = (a, b) => { const [ax,ay,az,aw] = a, [bx,by,bz,bw] = b; return [ax*bw+aw*bx+ay*bz-az*by, ay*bw+aw*by+az*bx-ax*bz, az*bw+aw*bz+ax*by-ay*bx, aw*bw-ax*bx-ay*by-az*bz]; };
function quat(a, b, g, o){
  const d = Math.PI / 180, x = b*d, y = a*d, z = -g*d;
  const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2), s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
  let q = [s1*c2*c3+c1*s2*s3, c1*s2*c3-s1*c2*s3, c1*c2*s3-s1*s2*c3, c1*c2*c3+s1*s2*s3];
  q = mul(q, [-Math.SQRT1_2, 0, 0, Math.SQRT1_2]);
  const h = -o * d / 2;
  return mul(q, [0, 0, Math.sin(h), Math.cos(h)]);
}
function fwd([x, y, z, w]){
  // gira o vetor (0,0,-1) pelo quaternion
  return [-2*w*y - 2*x*z, 2*w*x - 2*y*z, -1 + 2*x*x + 2*y*y];
}
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
let gy = {has: false, yaw: 0, pitch: 0, y0: 0, p0: 0, rawYaw: null, init: false};
function onOri(e){
  if(e.alpha == null) return;
  const o = (screen.orientation ? screen.orientation.angle : (window.orientation || 0));
  const f = fwd(quat(e.alpha, e.beta, e.gamma, o));
  const yaw = Math.atan2(f[0], -f[2]), pitch = Math.asin(Math.max(-1, Math.min(1, f[1])));
  if(!gy.init){
    gy.yaw = yaw; gy.pitch = pitch; gy.y0 = yaw; gy.p0 = pitch;
    gy.rawYaw = yaw; gy.init = true;
  } else {
    // Acumula a rotação sem voltar ao centro ao cruzar +/-180 graus.
    const deltaYaw = wrap(yaw - gy.rawYaw);
    gy.rawYaw = yaw;
    gy.yaw += deltaYaw * 0.6;
    gy.pitch += (pitch - gy.pitch) * 0.6;
  }
  gy.has = true;
}
addEventListener('dblclick', () => { gy.y0 = gy.yaw; gy.p0 = gy.pitch; });

/* ---------- Desenho ---------- */
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const items = ['ENTRAR EM VR', 'JOGOS', 'CONFIGURAÇÕES'];
let activeMenu = 'home', lastPinch = false;
let EW, EH, cur = [], lastT = 0, menu = {}, pageButton = null;

const toEye = p => {
  const vw = vid.videoWidth || 1280, vh = vid.videoHeight || 720, s = Math.max(EW / vw, EH / vh);
  return [(EW - vw * s) / 2 + p.x * vw * s, (EH - vh * s) / 2 + p.y * vh * s];
};

function layoutMenu(dt){
  // O menu nasce centralizado e só muda de lugar quando uma mão faz arminha.
  const m = Math.min(EW, EH);
  menu.visible = true;
  if(menu.cx == null){ menu.cx = EW / 2; menu.cy = EH / 2; }
  const gunHand = hands.find(h => h.on && h.gun && h.d);
  if(gunHand){
    const tip = toEye(gunHand.d[8]);
    // Posiciona o painel junto à ponta do indicador, sem deixá-lo sair da lente.
    menu.cx = Math.max(m * 0.34, Math.min(EW - m * 0.34, tip[0]));
    menu.cy = Math.max(m * 0.46, Math.min(EH - m * 0.46, tip[1] - m * 0.22));
    menu.handAttached = true;
  }
  menu.m = m; menu.w = m * 0.6; menu.h = m * 0.86;
  menu.btn = items.map((n, i) => ({n, x: menu.cx - m * 0.26, y: menu.cy - menu.h / 2 + m * 0.17 + i * m * 0.175, w: m * 0.52, h: m * 0.15}));
}

function drawHands(){
  cur = [];
  for(const h of hands){
    if(!h.on) continue;
    const P = h.d.map(toEye);
    const size = Math.hypot(h.d[0].x - h.d[9].x, h.d[0].y - h.d[9].y) || 1;
    const pd = Math.hypot(h.d[4].x - h.d[8].x, h.d[4].y - h.d[8].y) / size;
    const dist = (a,b) => Math.hypot(h.d[a].x-h.d[b].x, h.d[a].y-h.d[b].y);
    // Arminha: indicador esticado e os outros três dedos recolhidos.
    const indexExtended = dist(8,0) > dist(6,0) * 1.12 && dist(8,0) > dist(5,0) * 1.10;
    const middleFolded = dist(12,0) < dist(10,0) * 1.12;
    const ringFolded = dist(16,0) < dist(14,0) * 1.12;
    const pinkyFolded = dist(20,0) < dist(18,0) * 1.12;
    h.gun = indexExtended && middleFolded && ringFolded && pinkyFolded && pd > 0.48;
    h.pinch = h.pinch ? pd < 0.45 : pd < 0.3;
    cur.push({pt: [(P[4][0] + P[8][0]) / 2, (P[4][1] + P[8][1]) / 2], pinch: h.pinch, gun: h.gun});
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = h.gun ? '#278BFF' : h.pinch ? '#7CFF6B' : 'rgba(255,255,255,.9)';
    ctx.beginPath();
    for(const [a, b] of BONES){ ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(P[b][0], P[b][1]); }
    ctx.stroke();
    P.forEach((p, i) => {
      ctx.fillStyle = h.gun ? '#278BFF' : ([4,8,12,16,20].includes(i) ? '#4cc9f0' : '#fff');
      ctx.beginPath(); ctx.arc(p[0], p[1], [4,8,12,16,20].includes(i) ? 5 : 3.2, 0, 7); ctx.fill();
    });
  }
}

function drawSubPage(dx){
  const m=menu.m;
  if(activeMenu==='loading'){
    ctx.save(); ctx.translate(dx,0); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(8,16,36,.94)'; ctx.strokeStyle='#4cc9f0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(menu.cx-m*.30,menu.cy-m*.22,m*.60,m*.44,m*.05); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='600 '+m*.04+'px system-ui'; ctx.fillText('Voltando ao menu...',menu.cx,menu.cy+m*.12);
    ctx.beginPath(); ctx.arc(menu.cx,menu.cy-m*.06,m*.07,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=m*.018; ctx.stroke();
    const spin = (performance.now() / 420) % (Math.PI * 2);
    ctx.beginPath(); ctx.arc(menu.cx,menu.cy-m*.06,m*.07,spin,spin+Math.PI*1.35); ctx.strokeStyle='#4cc9f0'; ctx.lineWidth=m*.018; ctx.lineCap='round'; ctx.stroke();
    ctx.restore();
    return;
  }
  const w=m*.72, h=m*.58, x=menu.cx-w/2, y=menu.cy-h/2;
  ctx.save(); ctx.translate(dx,0);
  ctx.fillStyle='rgba(8,16,36,.94)'; ctx.strokeStyle='#4cc9f0'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,m*.05); ctx.fill(); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
  ctx.font='700 '+m*.055+'px system-ui'; ctx.fillText(activeMenu==='games'?'MENU DE JOGOS':'CONFIGURAÇÕES',menu.cx,menu.cy-h*.25);
  ctx.font='600 '+m*.034+'px system-ui'; ctx.fillStyle='rgba(255,255,255,.9)';
  if(activeMenu==='games'){ ctx.fillText('Nenhum jogo encontrado.',menu.cx,menu.cy); ctx.fillText('Instale jogos para tentar jogar.',menu.cx,menu.cy+m*.065); }
  else { ctx.fillText('Configurações do VR',menu.cx,menu.cy); ctx.fillText('Use o modo VR Box e ajuste as duas telas.',menu.cx,menu.cy+m*.065); }
  pageButton={x:menu.cx-m*.19,y:menu.cy+h*.28,w:m*.38,h:m*.12};
  ctx.fillStyle='#4cc9f0'; ctx.beginPath(); ctx.roundRect(pageButton.x,pageButton.y,pageButton.w,pageButton.h,m*.025); ctx.fill();
  ctx.fillStyle='#06121f'; ctx.font='700 '+m*.04+'px system-ui'; ctx.fillText('VOLTAR',menu.cx,pageButton.y+pageButton.h/2);
  ctx.restore();
}

function drawMenu(dx){
  if(!menu.visible) return;
  if(activeMenu!=='home'){ drawSubPage(dx); return; }
  const m = menu.m;
  ctx.save(); ctx.translate(dx, 0);
  ctx.fillStyle = 'rgba(8,16,36,.78)'; ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(menu.cx - menu.w / 2, menu.cy - menu.h / 2, menu.w, menu.h, m * 0.05); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + m * 0.065 + 'px system-ui'; ctx.fillText('MENU', menu.cx, menu.cy - menu.h / 2 + m * 0.09);
  ctx.font = '600 ' + m * 0.025 + 'px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillText('ALFA 0.001', menu.cx, menu.cy + menu.h / 2 - m * 0.075);
  ctx.fillText('@lsevi_12', menu.cx, menu.cy + menu.h / 2 - m * 0.04);
  for(const b of menu.btn){
    const hov = cur.some(c => c.pt[0] > b.x && c.pt[0] < b.x + b.w && c.pt[1] > b.y && c.pt[1] < b.y + b.h);
    const press = hov && cur.some(c => c.pinch);
    ctx.fillStyle = press ? '#18C964' : (hov ? '#4cc9f0' : 'rgba(76,201,240,.22)');
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, m * 0.03); ctx.fill();
    ctx.fillStyle = hov ? '#06121f' : '#fff';
    ctx.font = '700 ' + m * (b.n.length > 8 ? 0.05 : 0.065) + 'px system-ui';
    ctx.fillText(b.n, b.x + b.w / 2, b.y + b.h / 2);
    if (b.n === 'JOGOS' && activeMenu === 'games') { ctx.fillStyle = '#fff'; ctx.font = '600 ' + m * 0.034 + 'px system-ui'; ctx.fillText('Nenhum jogo encontrado.', menu.cx, b.y + b.h + m * 0.07); }
    if (b.n === 'CONFIGURAÇÕES' && activeMenu === 'settings') { ctx.fillStyle = '#fff'; ctx.font = '600 ' + m * 0.03 + 'px system-ui'; ctx.fillText('Configurações do VR', menu.cx, b.y + b.h + m * 0.07); }
  }
  for(const c of cur){
    ctx.strokeStyle = c.gun ? '#278BFF' : c.pinch ? '#7CFF6B' : '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.pt[0], c.pt[1], c.pinch ? m * 0.018 : m * 0.03, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function handleMenuGestures(){
  if(!menu.visible){ lastPinch = cur.some(c => c.pinch); return; }
  // A arminha agora só reposiciona/ancora o menu na mão; nunca troca de página.
  const pinching = cur.some(c => c.pinch);
  if(activeMenu==='loading') activeMenu='home';
  if(pinching && !lastPinch){
    const p=cur.find(c=>c.pinch)?.pt;
    if(activeMenu!=='home' && pageButton && p && p[0]>=pageButton.x && p[0]<=pageButton.x+pageButton.w && p[1]>=pageButton.y && p[1]<=pageButton.y+pageButton.h){ activeMenu='home'; }
    else if(activeMenu==='home'){
      const b=menu.btn.find(x=>p && p[0]>=x.x && p[0]<=x.x+x.w && p[1]>=x.y && p[1]<=x.y+x.h);
      if(b?.n==='JOGOS') activeMenu='games';
      else if(b?.n==='CONFIGURAÇÕES') activeMenu='settings';
      else if(b?.n==='ENTRAR EM VR') activeMenu='home';
    }
  }
  lastPinch = pinching;
}
function frame(ts){
  if(!running) return;
  requestAnimationFrame(frame);
  const t = ts / 1000, dt = Math.min(t - lastT, 0.1) || 0.016; lastT = t;
  detect();
  // suavização extra a cada frame de tela (60Hz) para ficar bem fluido
  const k = 1 - Math.exp(-dt * 28);
  for(const h of hands){
    if(h.on && t - h.seen > 0.25){ h.on = false; h.d = null; continue; }
    if(h.on) h.t.forEach((q, i) => { h.d[i].x += (q.x - h.d[i].x) * k; h.d[i].y += (q.y - h.d[i].y) * k; });
  }
  const IW = innerWidth, IH = innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, IW, IH);
  EW = stereo ? IW / 2 : IW; EH = IH;
  layoutMenu(dt);
  const vw = vid.videoWidth || 1280, vh = vid.videoHeight || 720, s = Math.max(EW / vw, EH / vh);
  const disp = EW * 0.008;
  for(let e = 0; e < (stereo ? 2 : 1); e++){
    ctx.save(); ctx.translate(e * EW, 0);
    ctx.beginPath();
    const lensR = Math.min(EW * 0.47, EH * 0.47);
    ctx.arc(EW / 2, EH / 2, lensR, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(vid, (EW - vw * s) / 2, (EH - vh * s) / 2, vw * s, vh * s);
    drawHands();
    drawMenu(stereo ? (e === 0 ? disp : -disp) : 0);
    ctx.restore();
  }
  handleMenuGestures();
}

/* ---------- Início ---------- */
$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true; $('ov').classList.add('loading');
  stereo = true;
  let step = 'permissões';
  try{
    document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {});
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      await DeviceOrientationEvent.requestPermission();
    }
    addEventListener('deviceorientation', onOri);
    st.textContent = 'Abrindo a câmera...';
    const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 60}}});
    vid.srcObject = stream; await vid.play();
    navigator.wakeLock?.request('screen').catch(() => {});
    st.textContent = 'Carregando o rastreio das mãos (pode demorar um pouco)...';
    const BASES = ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14', 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
    let lib = null, base = '';
    for(const b of BASES){
      try{ step = 'biblioteca das mãos'; lib = await import(b + '/vision_bundle.mjs'); base = b; break; }catch(e){}
    }
    if(!lib) throw new Error('não consegui baixar a biblioteca (confira a internet)');
    const {FilesetResolver, HandLandmarker} = lib;
    step = 'arquivos de processamento';
    const fs = await FilesetResolver.forVisionTasks(base + '/wasm');
    step = 'modelo da mão';
    const res = await fetch('https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task');
    if(!res.ok) throw new Error('o download do modelo deu erro ' + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    step = 'iniciar o rastreio';
    const opt = d => ({baseOptions: {modelAssetBuffer: buf, delegate: d}, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5});
    try{ lm = await HandLandmarker.createFromOptions(fs, opt('GPU')); }
    catch(e){ lm = await HandLandmarker.createFromOptions(fs, opt('CPU')); }
    $('ov').style.display = 'none'; cv.style.display = 'block';
    resize(); running = true; requestAnimationFrame(frame);
  }catch(e){
    st.textContent = 'Deu erro em "' + step + '": ' + (e.message || e) + '. Confira a internet e se você permitiu a câmera e o movimento.';
    $('ov').classList.remove('loading'); btn.disabled = false; btn.textContent = 'TENTAR DE NOVO';
  }
};
</script>
</body>
</html>
